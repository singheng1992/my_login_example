version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: login_demo_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: login_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: login_demo_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer:4.8.1
    container_name:  login_demo_adminer
    ports:
      - 18080:8080
    environment:
      - ADMINER_DEFAULT_SERVER=db

  redisinsight:
    image: redis/redisinsight:2.68
    container_name:  login_demo_redisinsight
    ports:
      - 15540:5540
volumes:
  postgres_data:
  redis_data:
