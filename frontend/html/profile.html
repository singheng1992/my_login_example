<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人中心 - Login Demo</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="profile-header">
            <h1>个人中心</h1>
        </div>

        <div id="alert" class="alert hidden"></div>

        <div class="avatar">
            <img id="avatar-img" src="/images/default-avatar.png" alt="头像">
        </div>

        <div class="info-item">
            <label>用户名</label>
            <span id="username">-</span>
        </div>
        <div class="info-item">
            <label>昵称</label>
            <span id="nickname">-</span>
        </div>
        <div class="info-item">
            <label>邮箱</label>
            <span id="email">-</span>
        </div>
        <div class="info-item">
            <label>手机号</label>
            <span id="phone">-</span>
        </div>

        <div class="form-group" style="margin-top: 20px;">
            <label>修改昵称</label>
            <input type="text" id="new-nickname" placeholder="输入新昵称">
        </div>

        <div class="form-group">
            <label>上传头像</label>
            <input type="file" id="avatar-file" accept="image/*">
        </div>

        <button id="update-btn" class="btn btn-primary">更新信息</button>
        <button id="logout-btn" class="btn btn-primary logout-btn">退出登录</button>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/profile.js"></script>
</body>
</html>
