<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册 - Login Demo</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>创建账户</h1>
            <p>加入我们开始使用</p>
        </div>

        <div id="alert" class="alert hidden"></div>

        <form id="register-form">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" id="username" required minlength="3" maxlength="50">
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" id="password" required minlength="6" maxlength="100">
            </div>
            <div class="form-group">
                <label>确认密码</label>
                <input type="password" id="confirm-password" required>
            </div>
            <div class="form-group">
                <label>昵称</label>
                <input type="text" id="nickname" required>
            </div>
            <div class="form-group">
                <label>邮箱（可选）</label>
                <input type="email" id="email">
            </div>
            <div class="form-group">
                <label>手机号（可选）</label>
                <input type="tel" id="phone" maxlength="11">
            </div>
            <button type="submit" class="btn btn-primary">注册</button>
        </form>

        <div class="links">
            <p><a href="/html/index.html">返回首页</a></p>
            <p>已有账户？ <a href="/html/login.html">立即登录</a></p>
        </div>
    </div>

    <script src="/js/config.js"></script>
    <script src="/js/utils.js"></script>
    <script src="/js/register.js"></script>
</body>
</html>
